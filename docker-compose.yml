services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: trend_coach
      POSTGRES_PASSWORD: trend_coach
      POSTGRES_DB: trend_coach
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trend_coach -d trend_coach"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
