        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
      responses:
        '202':
          description: 已接收（重复 eventId 同样返回 202）
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 未同意上报
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/asr/transcribe:
    post:
      summary: 语音转写（MiniMax ASR）
      description: 音频仅在内存中转发给上游，不落盘、不落日志；文本清洗后返回，空结果 422。请求体上限 3MiB。
      security:
        - bearerAuth: []
          deviceId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsrRequest'
      responses:
