                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/portal/auth/register:
    post:
      summary: 门户注册（公开）
      description: 仅创建 student 账号；成功即返回门户会话。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  pattern: '^[a-z][a-z0-9._-]{2,31}$'
                password:
                  type: string
                  minLength: 10
                  maxLength: 128
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        '201':
          description: 已注册
          content:
            application/json:
              schema:
                type: object
                required: [token, user]
                properties:
                  token:
                    type: string
                  user:
                    type: object
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 用户名已存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/portal/auth/login:
    post:
      summary: 门户登录（公开）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                required: [token, user]
                properties:
                  token:
                    type: string
                  user:
                    type: object
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/portal/auth/session:
    get:
      summary: 当前门户会话
      security:
        - sessionAuth: []
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      summary: 退出门户会话
      security:
        - sessionAuth: []
      responses:
        '200':
          description: 已退出
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/portal/me:
    get:
      summary: 个人资料
      security:
        - sessionAuth: []
      responses:
        '200':
          description: 资料
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      summary: 修改显示名
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile:
                    type: object
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/portal/me/password:
    post:
      summary: 修改密码（吊销其他会话）
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 10
                  maxLength: 128
      responses:
        '200':
          description: 已修改
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/portal/me/devices:
    get:
      summary: 我的设备
      security:
        - sessionAuth: []
      responses:
        '200':
          description: 设备列表
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/portal/me/devices/{deviceId}:
    delete:
      summary: 解绑我的设备
      security:
        - sessionAuth: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9._:-]{8,128}$'
      responses:
        '200':
          description: 已解绑
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/portal/releases:
    get:
      summary: 版本发布清单（公开）
      responses:
        '200':
          description: 清单（60 秒缓存）
          content:
            application/json:
              schema:
                type: object
                required: [dshVersion, webAppPackage, plugin]
                properties:
                  dshVersion:
                    type: string
                  webAppPackage:
                    type: string
                  plugin:
                    type: [object, 'null']
                    additionalProperties: true
        '503':
          description: 清单格式错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/portal/stats:
    get:
      summary: 站点统计（公开）
      responses:
        '200':
          description: 已发布内容计数（60 秒缓存）
          content:
            application/json:
              schema:
                type: object
                required: [courses, knowledgePoints, segments, articles]
                properties:
                  courses:
                    type: integer
                  knowledgePoints:
                    type: integer
                  segments:
                    type: integer
                  articles:
                    type: integer
        '429':
          $ref: '#/components/responses/TooManyRequests'
