openapi: 3.1.0
info:
  title: 趋势课程云端服务
  version: 0.2.0
  description: |
    仅供 dsh-plugin-trend-coach 使用。学员业务接口只读知识内容（进度与事件同意除外），凭据只出现在插件 Host 侧。
    接口口径以 docs/architecture/cloud-service-integration-checklist.md 为准。
servers:
  - url: http://127.0.0.1:3939

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    deviceId:
      type: apiKey
      in: header
      name: x-device-id
    sessionAuth:
      type: http
      scheme: bearer
      description: 后台会话令牌（仅 operator/admin），与设备 accessToken 分离。

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        requestId:
          type: string

    Segment:
      type: object
      additionalProperties: false
      required:
        [segmentId, courseId, chapterId, knowledgePointId, title, startSec, endSec, text, score]
      properties:
        segmentId:
          type: string
          pattern: '^seg-[A-Za-z0-9._-]+$'
          maxLength: 80
        courseId:
          type: string
        chapterId:
          type: string
        knowledgePointId:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 200
        courseTitle:
          type: string
          maxLength: 200
        chapterTitle:
          type: string
          maxLength: 200
        knowledgePointTitle:
          type: string
          maxLength: 200
        startSec:
          type: integer
          minimum: 0
        endSec:
          type: integer
        text:
          type: string
          minLength: 1
          maxLength: 4000
        score:
          type: number
          minimum: 0
          maximum: 1

    RelatedKnowledgePoint:
      type: object
      additionalProperties: false
      required: [knowledgePointId, title]
      properties:
        knowledgePointId:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 200

    SearchResponse:
      type: object
      additionalProperties: false
      required: [segments, relatedKnowledgePoints]
      properties:
        segments:
          type: array
          items:
            $ref: '#/components/schemas/Segment'
        relatedKnowledgePoints:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/RelatedKnowledgePoint'

    Grant:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, expiresAt, deviceId]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresAt:
          type: integer
          description: 毫秒时间戳
        deviceId:
          type: string

    DeviceCodeStart:
      type: object
      additionalProperties: false
      required: [deviceCode, userCode, verificationUri, expiresIn, interval]
      properties:
        deviceCode:
          type: string
        userCode:
          type: string
        verificationUri:
          type: string
          format: uri
        expiresIn:
          type: integer
          description: 秒
        interval:
          type: integer
          description: 轮询间隔，秒

    DeviceTokenResponse:
      oneOf:
        - type: object
          additionalProperties: false
          required: [status]
          properties:
            status:
              const: pending
        - type: object
          additionalProperties: false
          required: [status]
          properties:
            status:
              const: expired
        - type: object
          additionalProperties: false
          required: [status, grant]
          properties:
            status:
              const: authorized
            grant:
              $ref: '#/components/schemas/Grant'

    PlaybackSession:
      type: object
      additionalProperties: false
      required: [sessionId, playlistUrl, expiresAt, watermark]
      properties:
        sessionId:
          type: string
        playlistUrl:
          type: string
          format: uri
        expiresAt:
          type: integer
          description: 毫秒时间戳，至少覆盖 60s 播放窗口
        watermark:
          type: object
          additionalProperties: false
          required: [label]
          properties:
            label:
              type: string

    EventsConsent:
      type: object
      additionalProperties: false
      required: [consent]
      properties:
        consent:
          type: boolean

    EventRequest:
      type: object
      additionalProperties: false
      required: [eventId, name, props]
      properties:
        eventId:
          type: string
          pattern: '^[A-Za-z0-9._:-]{8,64}$'
        name:
          type: string
          enum: [search_requested, citation_clicked, player_started]
        occurredAt:
          type: integer
          description: 毫秒时间戳；缺省为服务端接收时间
        props:
          type: object
          description: |
            字段白名单随 name 变化，不接受其它字段：
            search_requested = durationMs/topK/hits/empty；
            citation_clicked = segmentId；
            player_started = startupMs/autoplayBlocked。

    CatalogCourseSummary:
      type: object
      additionalProperties: false
      required: [courseId, title, chapterCount, knowledgePointCount, completedCount]
      properties:
        courseId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        title:
          type: string
          minLength: 1
          maxLength: 200
        chapterCount:
          type: integer
          minimum: 0
        knowledgePointCount:
          type: integer
          minimum: 0
        completedCount:
          type: integer
          minimum: 0

    CatalogCourseList:
      type: object
      additionalProperties: false
      required: [courses]
      properties:
        courses:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/CatalogCourseSummary'

    CatalogKnowledgePoint:
      type: object
      additionalProperties: false
      required: [knowledgePointId, title, position, watchedSec, completed]
      properties:
        knowledgePointId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        title:
          type: string
          minLength: 1
          maxLength: 200
        position:
          type: integer
        segmentId:
          type: string
          pattern: '^seg-[A-Za-z0-9._-]+$'
          maxLength: 80
        watchedSec:
          type: integer
          minimum: 0
          maximum: 86400
        completed:
          type: boolean

    CatalogChapter:
      type: object
      additionalProperties: false
      required: [chapterId, title, position, knowledgePoints]
      properties:
        chapterId:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 200
        position:
          type: integer
        knowledgePoints:
          type: array
          items:
            $ref: '#/components/schemas/CatalogKnowledgePoint'

    CatalogCourse:
      type: object
      additionalProperties: false
      required: [courseId, title, chapters]
      properties:
        courseId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        title:
          type: string
          minLength: 1
          maxLength: 200
        chapters:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/CatalogChapter'

    KnowledgePointArticle:
      type: object
      additionalProperties: false
      required: [markdown, version, publishedAt]
      properties:
        markdown:
          type: string
          minLength: 1
          maxLength: 20000
        version:
          type: integer
          minimum: 1
        publishedAt:
          type: integer
          description: 毫秒时间戳

    KnowledgePointDetail:
      type: object
      additionalProperties: false
      required: [knowledgePointId, courseId, chapterId, title, article, adjacentKnowledgePoints]
      properties:
        knowledgePointId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        courseId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        chapterId:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 200
        article:
          oneOf:
            - $ref: '#/components/schemas/KnowledgePointArticle'
            - type: 'null'
        segmentId:
          type: string
          pattern: '^seg-[A-Za-z0-9._-]+$'
          maxLength: 80
        adjacentKnowledgePoints:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/RelatedKnowledgePoint'

    ProgressUpdate:
      type: object
      additionalProperties: false
      required: [watchedSec, completed]
      properties:
        watchedSec:
          type: integer
          minimum: 0
          maximum: 86400
        completed:
          type: boolean

    ProgressResult:
      type: object
      additionalProperties: false
      required: [knowledgePointId, watchedSec, completed, updatedAt]
      properties:
        knowledgePointId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        watchedSec:
          type: integer
          minimum: 0
          maximum: 86400
        completed:
          type: boolean
        updatedAt:
          type: integer
          description: 毫秒时间戳

    UserRole:
      type: string
      enum: [student, operator, admin]
    UserStatus:
      type: string
      enum: [active, disabled]
    AdminUser:
      type: object
      additionalProperties: false
      required: [userId, displayName, role, status, createdAt]
      properties:
        userId:
          type: string
        username:
          type: string
          nullable: true
          description: 历史设备自动创建账号可能为空；M3 起账号均由管理员创建。
        displayName:
          type: string
          nullable: true
          maxLength: 200
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        deviceCount:
          type: integer
          minimum: 0
        createdAt:
          type: integer
          description: 毫秒时间戳
        lastActiveAt:
          type: integer
          nullable: true
          description: 最近设备活跃时间（毫秒时间戳）
    SessionUser:
      type: object
      additionalProperties: false
      required: [userId, username, displayName, role]
      properties:
        userId:
          type: string
        username:
          type: string
        displayName:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/UserRole'
    SessionResponse:
      type: object
      additionalProperties: false
      required: [token, expiresAt, user]
      properties:
        token:
          type: string
        expiresAt:
          type: integer
          description: 毫秒时间戳
        user:
          $ref: '#/components/schemas/SessionUser'
    UserListResponse:
      type: object
      additionalProperties: false
      required: [users, total, offset, limit]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        total:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
    InviteRedeemRequest:
      type: object
      additionalProperties: false
      required: [inviteCode, password]
      properties:
        inviteCode:
          type: string
          maxLength: 32
        password:
          type: string
          minLength: 10
          maxLength: 128
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, displayName, role]
      properties:
        username:
          type: string
          pattern: '^[a-z][a-z0-9._-]{2,31}$'
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        role:
          $ref: '#/components/schemas/UserRole'
        password:
          type: string
          minLength: 10
          maxLength: 128
    CreateUserResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/AdminUser'
        inviteCode:
          type: string
          description: 仅在未提供初始密码时返回一次。
        inviteExpiresAt:
          type: integer
          description: 邀请码过期时间（毫秒时间戳）
    PatchUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
    ResetUserRequest:
      type: object
      additionalProperties: false
      properties:
        password:
          type: string
          minLength: 10
          maxLength: 128
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          minLength: 10
          maxLength: 128

    ContentStatus:
      type: string
      enum: [draft, published, archived]

    AdminCourse:
      type: object
      additionalProperties: false
      required: [courseId, title, status]
      properties:
        courseId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          $ref: '#/components/schemas/ContentStatus'

    AdminCourseSummary:
      type: object
      additionalProperties: false
      required: [courseId, title, status, chapterCount, knowledgePointCount, segmentCount, articleCount]
      properties:
        courseId:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/ContentStatus'
        chapterCount:
          type: integer
          minimum: 0
        knowledgePointCount:
          type: integer
          minimum: 0
        segmentCount:
          type: integer
          minimum: 0
        articleCount:
          type: integer
          minimum: 0

    AdminArticleMeta:
      type: object
      additionalProperties: false
      required: [version, status]
      properties:
        version:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/ContentStatus'
        publishedAt:
          type: [integer, 'null']

    AdminArticle:
      type: object
      additionalProperties: false
      required: [markdown, version, status]
      properties:
        markdown:
          type: string
          minLength: 1
          maxLength: 20000
        version:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/ContentStatus'
        publishedAt:
          type: [integer, 'null']

    AdminKnowledgePoint:
      type: object
      additionalProperties: false
      required: [knowledgePointId, title, position, segmentCount, article]
      properties:
        knowledgePointId:
          type: string
        title:
          type: string
        position:
          type: integer
        segmentCount:
          type: integer
          minimum: 0
        article:
          oneOf:
            - $ref: '#/components/schemas/AdminArticleMeta'
            - type: 'null'

    AdminChapter:
      type: object
      additionalProperties: false
      required: [chapterId, title, position]
      properties:
        chapterId:
          type: string
        title:
          type: string
        position:
          type: integer

    AdminChapterTree:
      type: object
      additionalProperties: false
      required: [chapterId, title, position, knowledgePoints]
      properties:
        chapterId:
          type: string
        title:
          type: string
        position:
          type: integer
        knowledgePoints:
          type: array
          items:
            $ref: '#/components/schemas/AdminKnowledgePoint'

    AdminCourseTree:
      type: object
      additionalProperties: false
      required: [course, chapters]
      properties:
        course:
          $ref: '#/components/schemas/AdminCourse'
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/AdminChapterTree'

    AdminSegment:
      type: object
      additionalProperties: false
      required:
        [segmentId, courseId, chapterId, knowledgePointId, title, startSec, endSec, text, status, hasEmbedding]
      properties:
        segmentId:
          type: string
          pattern: '^seg-[A-Za-z0-9._-]{1,76}$'
        courseId:
          type: string
        chapterId:
          type: string
        knowledgePointId:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 200
        startSec:
          type: integer
          minimum: 0
          maximum: 86400
        endSec:
          type: integer
          minimum: 1
          maximum: 86400
        text:
          type: string
          minLength: 1
          maxLength: 4000
        status:
          $ref: '#/components/schemas/ContentStatus'
        hasEmbedding:
          type: boolean

    AdminSegmentList:
      type: object
      additionalProperties: false
      required: [segments, total, offset, limit]
      properties:
        segments:
          type: array
          items:
            $ref: '#/components/schemas/AdminSegment'
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer

    CreateCourseRequest:
      type: object
      additionalProperties: false
      required: [courseId, title]
      properties:
        courseId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          $ref: '#/components/schemas/ContentStatus'

    PatchCourseRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          $ref: '#/components/schemas/ContentStatus'

    CreateChapterRequest:
      type: object
      additionalProperties: false
      required: [chapterId, title]
      properties:
        chapterId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        title:
          type: string
          minLength: 1
          maxLength: 200
        position:
          type: integer
          minimum: 0
          maximum: 10000

    PatchChapterRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        position:
          type: integer
          minimum: 0
          maximum: 10000

    CreateKnowledgePointRequest:
      type: object
      additionalProperties: false
      required: [knowledgePointId, title]
      properties:
        knowledgePointId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        title:
          type: string
          minLength: 1
          maxLength: 200
        position:
          type: integer
          minimum: 0
          maximum: 10000

    PatchKnowledgePointRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        position:
          type: integer
          minimum: 0
          maximum: 10000

    PutArticleRequest:
      type: object
      additionalProperties: false
      required: [markdown, status]
      properties:
        markdown:
          type: string
          minLength: 1
          maxLength: 20000
        status:
          $ref: '#/components/schemas/ContentStatus'

    CreateSegmentRequest:
      type: object
      additionalProperties: false
      required: [segmentId, courseId, chapterId, knowledgePointId, title, startSec, endSec, text]
      properties:
        segmentId:
          type: string
          pattern: '^seg-[A-Za-z0-9._-]{1,76}$'
        courseId:
          type: string
        chapterId:
          type: string
        knowledgePointId:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 200
        startSec:
          type: integer
          minimum: 0
          maximum: 86400
        endSec:
          type: integer
          minimum: 1
          maximum: 86400
        text:
          type: string
          minLength: 1
          maxLength: 4000
        status:
          $ref: '#/components/schemas/ContentStatus'

    PatchSegmentRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        startSec:
          type: integer
          minimum: 0
          maximum: 86400
        endSec:
          type: integer
          minimum: 1
          maximum: 86400
        text:
          type: string
          minLength: 1
          maxLength: 4000
        status:
          $ref: '#/components/schemas/ContentStatus'

    ReindexRequest:
      type: object
      additionalProperties: false
      properties:
        courseId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'

    AsrRequest:
      type: object
      additionalProperties: false
      required: [audio, format, durationMs]
      properties:
        audio:
          type: string
          minLength: 1
          maxLength: 2560064
          description: 完整 WAV 的 base64；16kHz、单声道、PCM16，解码后 ≤1920044B。
        format:
          type: string
          enum: [wav]
        durationMs:
          type: integer
          minimum: 1
          maximum: 60000

    AsrResponse:
      type: object
      additionalProperties: false
      required: [text, durationMs]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
        durationMs:
          type: integer
          minimum: 1
          maximum: 60000

  responses:
    BadRequest:
      description: 入参或结构不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 未授权或令牌过期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 设备不匹配或越权
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 资源不存在或已下架
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: 超出配额
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 资源已存在或当前状态不允许该操作
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: 请求体或音频超过上限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: 未识别到语音
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGateway:
      description: 上游协议异常
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: 上游不可用或未配置
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

paths:
  /health:
    get:
      summary: 健康检查（含数据库连通性）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean

  /v1/auth/device/code:
    post:
      summary: 发起设备码授权
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [clientId, deviceId]
              properties:
                clientId:
                  const: dsh-plugin-trend-coach
                deviceId:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        '200':
          description: 设备码已签发
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCodeStart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/auth/device/token:
    post:
      summary: 轮询设备码状态
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [deviceCode]
              properties:
                deviceCode:
                  type: string
      responses:
        '200':
          description: 待批准 / 已过期 / 已授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/auth/refresh:
    post:
      summary: 轮换 access/refresh 令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken, deviceId]
              properties:
                refreshToken:
                  type: string
                deviceId:
                  type: string
      responses:
        '200':
          description: 新 grant；旧 refresh 立即失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/auth/revoke:
    post:
      summary: 注销当前设备并吊销其令牌
      description: 吊销该设备全部 access/refresh 并置为 revoked；重新设备授权可恢复，不影响同账号其它设备。
      security:
        - bearerAuth: []
          deviceId: []
      responses:
        '200':
          description: 已注销
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/auth/device/approve:
    post:
      summary: 批准设备码并绑定账号
      description: |
        学员：提交 `userCode` + `username`/`password`，或 `userCode` + `inviteCode` + 新 `password`。
        运营/管理员：带后台会话 Bearer，提交 `userCode` 与可选 `userId` 代批。
        不再接受共享控制台令牌；设备批准后绑定固定账号。
      security:
        - sessionAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userCode]
              properties:
                userCode:
                  type: string
                  pattern: '^[A-Z0-9]{4}-[A-Z0-9]{4}$'
                username:
                  type: string
                  pattern: '^[a-z][a-z0-9._-]{2,31}$'
                password:
                  type: string
                  minLength: 10
                  maxLength: 128
                inviteCode:
                  type: string
                  maxLength: 32
                userId:
                  type: string
                  maxLength: 64
                  description: 仅后台会话代批时可用。
      responses:
        '200':
          description: 已批准
          content:
            application/json:
              schema:
                type: object
                required: [approved]
                properties:
                  approved:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/kb/search:
    post:
      summary: Top-K 片段检索
      security:
        - bearerAuth: []
          deviceId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query:
                  type: string
                  description: 去首尾空白后 1–500 字符
                topK:
                  type: integer
                  minimum: 1
                  maximum: 20
                  default: 5
                courseId:
                  type: string
                  pattern: '^[A-Za-z0-9._-]{1,64}$'
      responses:
        '200':
          description: 检索结果；空召回时给 relatedKnowledgePoints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/kb/segments/{segmentId}:
    get:
      summary: 片段详情（权威起止秒）
      security:
        - bearerAuth: []
          deviceId: []
      parameters:
        - name: segmentId
          in: path
          required: true
          schema:
            type: string
            pattern: '^seg-[A-Za-z0-9._-]+$'
            maxLength: 80
      responses:
        '200':
          description: 片段元数据，score 恒为 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Segment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/catalog/courses:
