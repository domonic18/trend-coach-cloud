openapi: 3.1.0
info:
  title: 趋势课程云端服务
  version: 0.2.0
  description: |
    仅供 dsh-plugin-trend-coach 使用。学员业务接口只读知识内容（进度与事件同意除外），凭据只出现在插件 Host 侧。
    接口口径以 docs/architecture/cloud-service-integration-checklist.md 为准。
servers:
  - url: http://127.0.0.1:3939

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    deviceId:
      type: apiKey
      in: header
      name: x-device-id
    sessionAuth:
      type: http
      scheme: bearer
      description: 后台会话令牌（仅 operator/admin），与设备 accessToken 分离。

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        requestId:
          type: string

    Segment:
      type: object
      additionalProperties: false
      required:
        [segmentId, courseId, chapterId, knowledgePointId, title, startSec, endSec, text, score]
      properties:
        segmentId:
          type: string
          pattern: '^seg-[A-Za-z0-9._-]+$'
          maxLength: 80
        courseId:
          type: string
        chapterId:
          type: string
        knowledgePointId:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 200
        courseTitle:
          type: string
          maxLength: 200
        chapterTitle:
          type: string
          maxLength: 200
        knowledgePointTitle:
          type: string
          maxLength: 200
        startSec:
          type: integer
          minimum: 0
        endSec:
          type: integer
        text:
          type: string
          minLength: 1
          maxLength: 4000
        score:
          type: number
          minimum: 0
          maximum: 1

    RelatedKnowledgePoint:
      type: object
      additionalProperties: false
      required: [knowledgePointId, title]
      properties:
        knowledgePointId:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 200

    SearchResponse:
      type: object
      additionalProperties: false
      required: [segments, relatedKnowledgePoints]
      properties:
        segments:
          type: array
          items:
            $ref: '#/components/schemas/Segment'
        relatedKnowledgePoints:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/RelatedKnowledgePoint'

    Grant:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, expiresAt, deviceId]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresAt:
          type: integer
          description: 毫秒时间戳
        deviceId:
          type: string

    DeviceCodeStart:
      type: object
      additionalProperties: false
      required: [deviceCode, userCode, verificationUri, expiresIn, interval]
      properties:
        deviceCode:
          type: string
        userCode:
          type: string
        verificationUri:
          type: string
          format: uri
        expiresIn:
          type: integer
          description: 秒
        interval:
          type: integer
          description: 轮询间隔，秒

    DeviceTokenResponse:
      oneOf:
        - type: object
          additionalProperties: false
          required: [status]
          properties:
            status:
              const: pending
        - type: object
          additionalProperties: false
          required: [status]
          properties:
            status:
              const: expired
        - type: object
          additionalProperties: false
          required: [status, grant]
          properties:
            status:
              const: authorized
            grant:
              $ref: '#/components/schemas/Grant'

    PlaybackSession:
      type: object
      additionalProperties: false
      required: [sessionId, playlistUrl, expiresAt, watermark]
      properties:
        sessionId:
          type: string
        playlistUrl:
          type: string
          format: uri
        expiresAt:
          type: integer
          description: 毫秒时间戳，至少覆盖 60s 播放窗口
        watermark:
          type: object
          additionalProperties: false
          required: [label]
          properties:
            label:
              type: string

    EventsConsent:
      type: object
      additionalProperties: false
      required: [consent]
      properties:
        consent:
          type: boolean

    EventRequest:
      type: object
      additionalProperties: false
      required: [eventId, name, props]
      properties:
        eventId:
          type: string
          pattern: '^[A-Za-z0-9._:-]{8,64}$'
        name:
          type: string
          enum: [search_requested, citation_clicked, player_started]
        occurredAt:
          type: integer
          description: 毫秒时间戳；缺省为服务端接收时间
        props:
          type: object
          description: |
            字段白名单随 name 变化，不接受其它字段：
            search_requested = durationMs/topK/hits/empty；
            citation_clicked = segmentId；
            player_started = startupMs/autoplayBlocked。

    CatalogCourseSummary:
      type: object
      additionalProperties: false
      required: [courseId, title, chapterCount, knowledgePointCount, completedCount]
      properties:
        courseId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        title:
          type: string
          minLength: 1
          maxLength: 200
        chapterCount:
          type: integer
          minimum: 0
        knowledgePointCount:
          type: integer
          minimum: 0
        completedCount:
          type: integer
          minimum: 0

    CatalogCourseList:
      type: object
      additionalProperties: false
      required: [courses]
      properties:
        courses:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/CatalogCourseSummary'

    CatalogKnowledgePoint:
      type: object
      additionalProperties: false
      required: [knowledgePointId, title, position, watchedSec, completed]
      properties:
        knowledgePointId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        title:
          type: string
          minLength: 1
          maxLength: 200
        position:
          type: integer
        segmentId:
          type: string
          pattern: '^seg-[A-Za-z0-9._-]+$'
          maxLength: 80
        watchedSec:
          type: integer
          minimum: 0
          maximum: 86400
        completed:
          type: boolean

    CatalogChapter:
      type: object
      additionalProperties: false
      required: [chapterId, title, position, hasArticle, figureCount, knowledgePoints]
      properties:
        chapterId:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 200
        position:
          type: integer
        hasArticle:
          type: boolean
        figureCount:
          type: integer
          minimum: 0
          maximum: 3
        knowledgePoints:
          type: array
          items:
            $ref: '#/components/schemas/CatalogKnowledgePoint'

    CatalogCourse:
      type: object
      additionalProperties: false
      required: [contractVersion, courseId, title, chapters]
      properties:
        contractVersion:
          type: integer
          minimum: 1
        courseId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        title:
          type: string
          minLength: 1
          maxLength: 200
        chapters:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/CatalogChapter'

    ChapterArticle:
      type: object
      additionalProperties: false
      required: [markdown, version, publishedAt]
      properties:
        markdown:
          type: string
          minLength: 1
          maxLength: 20000
          description: 仅 Markdown 子集；图片引用只允许 ![alt](figure:figureId)。
        version:
          type: integer
          minimum: 1
        publishedAt:
          type: integer
          description: 毫秒时间戳

    ChapterFigure:
      type: object
      additionalProperties: false
      required: [url, width, height, alt]
      properties:
        url:
          type: string
          description: 短时签名地址，默认 10 分钟；过期后重新请求本章。
        width:
          type: integer
          minimum: 800
        height:
          type: integer
          minimum: 800
        alt:
          type: string
          minLength: 1
          maxLength: 200
        caption:
          type: string
          minLength: 1
          maxLength: 200

    CatalogChapterArticle:
      type: object
      additionalProperties: false
      required: [chapterId, courseId, title, article, figures, adjacentChapters]
      properties:
        chapterId:
          type: string
        courseId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        title:
          type: string
          minLength: 1
          maxLength: 200
        article:
          oneOf:
            - $ref: '#/components/schemas/ChapterArticle'
            - type: 'null'
        figures:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ChapterFigure'
        adjacentChapters:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/RelatedChapter'

    RelatedChapter:
      type: object
      additionalProperties: false
      required: [chapterId, title]
      properties:
        chapterId:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 200

    KnowledgePointDetail:
      type: object
      additionalProperties: false
      required: [knowledgePointId, courseId, chapterId, title, adjacentKnowledgePoints]
      properties:
        knowledgePointId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        courseId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        chapterId:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 200
        segmentId:
          type: string
          pattern: '^seg-[A-Za-z0-9._-]+$'
          maxLength: 80
        adjacentKnowledgePoints:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/RelatedKnowledgePoint'

    ProgressUpdate:
      type: object
      additionalProperties: false
      required: [watchedSec, completed]
      properties:
        watchedSec:
          type: integer
          minimum: 0
          maximum: 86400
        completed:
          type: boolean

    ProgressResult:
      type: object
      additionalProperties: false
      required: [knowledgePointId, watchedSec, completed, updatedAt]
      properties:
        knowledgePointId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        watchedSec:
          type: integer
          minimum: 0
          maximum: 86400
        completed:
          type: boolean
        updatedAt:
          type: integer
          description: 毫秒时间戳

    UserRole:
      type: string
      enum: [student, operator, admin]
    UserStatus:
      type: string
      enum: [active, disabled]
    AdminUser:
      type: object
      additionalProperties: false
      required: [userId, displayName, role, status, createdAt]
      properties:
        userId:
          type: string
        username:
          type: string
          nullable: true
          description: 历史设备自动创建账号可能为空；M3 起账号均由管理员创建。
        displayName:
          type: string
          nullable: true
          maxLength: 200
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        deviceCount:
          type: integer
          minimum: 0
        createdAt:
          type: integer
          description: 毫秒时间戳
        lastActiveAt:
          type: integer
          nullable: true
          description: 最近设备活跃时间（毫秒时间戳）
    SessionUser:
      type: object
      additionalProperties: false
      required: [userId, username, displayName, role]
      properties:
        userId:
          type: string
        username:
          type: string
        displayName:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/UserRole'
    SessionResponse:
      type: object
      additionalProperties: false
      required: [token, expiresAt, user]
      properties:
        token:
          type: string
        expiresAt:
          type: integer
          description: 毫秒时间戳
        user:
          $ref: '#/components/schemas/SessionUser'
    UserListResponse:
      type: object
      additionalProperties: false
      required: [users, total, offset, limit]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        total:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
    InviteRedeemRequest:
      type: object
      additionalProperties: false
      required: [inviteCode, password]
      properties:
        inviteCode:
          type: string
          maxLength: 32
        password:
          type: string
          minLength: 10
          maxLength: 128
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, displayName, role]
      properties:
        username:
          type: string
          pattern: '^[a-z][a-z0-9._-]{2,31}$'
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        role:
          $ref: '#/components/schemas/UserRole'
        password:
          type: string
          minLength: 10
          maxLength: 128
    CreateUserResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/AdminUser'
        inviteCode:
          type: string
          description: 仅在未提供初始密码时返回一次。
        inviteExpiresAt:
          type: integer
          description: 邀请码过期时间（毫秒时间戳）
    PatchUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
    ResetUserRequest:
      type: object
      additionalProperties: false
      properties:
        password:
          type: string
          minLength: 10
          maxLength: 128
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          minLength: 10
          maxLength: 128

    ContentStatus:
      type: string
      enum: [draft, published, archived]

    AdminCourse:
      type: object
      additionalProperties: false
      required: [courseId, title, status]
      properties:
        courseId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          $ref: '#/components/schemas/ContentStatus'

    AdminCourseSummary:
      type: object
      additionalProperties: false
      required:
        [courseId, title, status, chapterCount, knowledgePointCount, segmentCount,
         chapterArticleCount, figureCount]
      properties:
        courseId:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/ContentStatus'
        chapterCount:
          type: integer
          minimum: 0
        knowledgePointCount:
          type: integer
          minimum: 0
        segmentCount:
          type: integer
          minimum: 0
        chapterArticleCount:
          type: integer
          minimum: 0
        figureCount:
          type: integer
          minimum: 0

    AdminArticleMeta:
      type: object
      additionalProperties: false
      required: [version, status]
      properties:
        version:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/ContentStatus'
        publishedAt:
          type: [integer, 'null']

    AdminArticle:
      type: object
      additionalProperties: false
      required: [markdown, version, status]
      properties:
        markdown:
          type: string
          minLength: 1
          maxLength: 20000
        version:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/ContentStatus'
        publishedAt:
          type: [integer, 'null']

    AdminKnowledgePoint:
      type: object
      additionalProperties: false
      required: [knowledgePointId, title, position, segmentCount]
      properties:
        knowledgePointId:
          type: string
        title:
          type: string
        position:
          type: integer
        segmentCount:
          type: integer
          minimum: 0

    AdminChapter:
      type: object
      additionalProperties: false
      required: [chapterId, title, position]
      properties:
        chapterId:
          type: string
        title:
          type: string
        position:
          type: integer

    AdminChapterTree:
      type: object
      additionalProperties: false
      required: [chapterId, title, position, article, figureCount, knowledgePoints]
      properties:
        chapterId:
          type: string
        title:
          type: string
        position:
          type: integer
        article:
          oneOf:
            - $ref: '#/components/schemas/AdminArticleMeta'
            - type: 'null'
        figureCount:
          type: integer
          minimum: 0
        knowledgePoints:
          type: array
          items:
            $ref: '#/components/schemas/AdminKnowledgePoint'

    AdminCourseTree:
      type: object
      additionalProperties: false
      required: [course, chapters]
      properties:
        course:
          $ref: '#/components/schemas/AdminCourse'
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/AdminChapterTree'

    AdminSegment:
      type: object
      additionalProperties: false
      required:
        [segmentId, courseId, chapterId, knowledgePointId, title, startSec, endSec, text, status, hasEmbedding]
      properties:
        segmentId:
          type: string
          pattern: '^seg-[A-Za-z0-9._-]{1,76}$'
        courseId:
          type: string
        chapterId:
          type: string
        knowledgePointId:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 200
        startSec:
          type: integer
          minimum: 0
          maximum: 86400
        endSec:
          type: integer
          minimum: 1
          maximum: 86400
        text:
          type: string
          minLength: 1
          maxLength: 4000
        status:
          $ref: '#/components/schemas/ContentStatus'
        hasEmbedding:
          type: boolean

    AdminSegmentList:
      type: object
      additionalProperties: false
      required: [segments, total, offset, limit]
      properties:
        segments:
          type: array
          items:
            $ref: '#/components/schemas/AdminSegment'
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer

    CreateCourseRequest:
      type: object
      additionalProperties: false
      required: [courseId, title]
      properties:
        courseId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          $ref: '#/components/schemas/ContentStatus'

    PatchCourseRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          $ref: '#/components/schemas/ContentStatus'

    CreateChapterRequest:
      type: object
      additionalProperties: false
      required: [chapterId, title]
      properties:
        chapterId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        title:
          type: string
          minLength: 1
          maxLength: 200
        position:
          type: integer
          minimum: 0
          maximum: 10000

    PatchChapterRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        position:
          type: integer
          minimum: 0
          maximum: 10000

    CreateKnowledgePointRequest:
      type: object
      additionalProperties: false
      required: [knowledgePointId, title]
      properties:
        knowledgePointId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        title:
          type: string
          minLength: 1
          maxLength: 200
        position:
          type: integer
          minimum: 0
          maximum: 10000

    PatchKnowledgePointRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        position:
          type: integer
          minimum: 0
          maximum: 10000

    PutArticleRequest:
      type: object
      additionalProperties: false
      required: [markdown, status]
      properties:
        markdown:
          type: string
          minLength: 1
          maxLength: 20000
        status:
          $ref: '#/components/schemas/ContentStatus'

    CreateSegmentRequest:
      type: object
      additionalProperties: false
      required: [segmentId, courseId, chapterId, knowledgePointId, title, startSec, endSec, text]
      properties:
        segmentId:
          type: string
          pattern: '^seg-[A-Za-z0-9._-]{1,76}$'
        courseId:
          type: string
        chapterId:
          type: string
        knowledgePointId:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 200
        startSec:
          type: integer
          minimum: 0
          maximum: 86400
        endSec:
          type: integer
          minimum: 1
          maximum: 86400
        text:
          type: string
          minLength: 1
          maxLength: 4000
        status:
          $ref: '#/components/schemas/ContentStatus'

    PatchSegmentRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        startSec:
          type: integer
          minimum: 0
          maximum: 86400
        endSec:
          type: integer
          minimum: 1
          maximum: 86400
        text:
          type: string
          minLength: 1
          maxLength: 4000
        status:
          $ref: '#/components/schemas/ContentStatus'

    ReindexRequest:
      type: object
      additionalProperties: false
      properties:
        courseId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'

    AsrRequest:
      type: object
      additionalProperties: false
      required: [audio, format, durationMs]
      properties:
        audio:
          type: string
          minLength: 1
          maxLength: 2560064
          description: 完整 WAV 的 base64；16kHz、单声道、PCM16，解码后 ≤1920044B。
        format:
          type: string
          enum: [wav]
        durationMs:
          type: integer
          minimum: 1
          maximum: 60000

    AsrResponse:
      type: object
      additionalProperties: false
      required: [text, durationMs]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
        durationMs:
          type: integer
          minimum: 1
          maximum: 60000

    MediaAssetStatus:
      type: string
      enum: [awaiting_upload, uploaded, processing, ready, failed, archived]

    MediaAsset:
      type: object
      additionalProperties: false
      required:
        [assetId, courseId, title, status, durationMs, sourceSizeBytes, errorCode, createdAt, updatedAt]
      properties:
        assetId:
          type: string
          pattern: '^asset_[0-9a-f]{16}$'
        courseId:
          type: string
        title:
          type: [string, 'null']
          minLength: 1
          maxLength: 200
        status:
          $ref: '#/components/schemas/MediaAssetStatus'
        durationMs:
          type: [integer, 'null']
          minimum: 0
        sourceSizeBytes:
          type: [integer, 'null']
          minimum: 0
        errorCode:
          type: [string, 'null']
          maxLength: 64
        createdAt:
          type: integer
        updatedAt:
          type: integer

    MediaAssetList:
      type: object
      additionalProperties: false
      required: [assets, total, offset, limit]
      properties:
        assets:
          type: array
          items:
            $ref: '#/components/schemas/MediaAsset'
        total:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1

    CreateMediaAssetRequest:
      type: object
      additionalProperties: false
      required: [courseId, title]
      properties:
        courseId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        title:
          type: string
          minLength: 1
          maxLength: 200

    PatchMediaAssetRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum: [archived]

    IngestRequest:
      type: object
      additionalProperties: false
      properties:
        language:
          type: string
          enum: [zh, en, auto]

    PipelineJobStatus:
      type: string
      enum: [queued, running, succeeded, failed, canceled]

    PipelineJobKind:
      type: string
      enum: [ingest, generate, illustrate]

    PipelineJobStage:
      type: string
      enum: [queued, probe, transcode, transcribe, structure, generate, figure_plan, figure_render, finalize, done]

    PipelineJob:
      type: object
      additionalProperties: false
      required:
        [jobId, assetId, courseId, kind, status, stage, progress, attempts, maxAttempts,
         cancelRequested, errorCode, createdAt, startedAt, finishedAt]
      properties:
        jobId:
          type: string
          pattern: '^job_[0-9a-f]{16}$'
        assetId:
          type: [string, 'null']
        courseId:
          type: string
        kind:
          $ref: '#/components/schemas/PipelineJobKind'
        status:
          $ref: '#/components/schemas/PipelineJobStatus'
        stage:
          $ref: '#/components/schemas/PipelineJobStage'
        progress:
          type: integer
          minimum: 0
          maximum: 100
        attempts:
          type: integer
          minimum: 0
        maxAttempts:
          type: integer
          minimum: 1
        cancelRequested:
          type: boolean
        errorCode:
          type: [string, 'null']
          maxLength: 64
        createdAt:
          type: integer
        startedAt:
          type: [integer, 'null']
        finishedAt:
          type: [integer, 'null']

    PipelineJobDetail:
      type: object
      additionalProperties: false
      required:
        [jobId, assetId, courseId, kind, status, stage, progress, attempts, maxAttempts,
         cancelRequested, errorCode, createdAt, startedAt, finishedAt, result]
      properties:
        jobId:
          type: string
          pattern: '^job_[0-9a-f]{16}$'
        assetId:
          type: [string, 'null']
        courseId:
          type: string
        kind:
          $ref: '#/components/schemas/PipelineJobKind'
        status:
          $ref: '#/components/schemas/PipelineJobStatus'
        stage:
          $ref: '#/components/schemas/PipelineJobStage'
        progress:
          type: integer
          minimum: 0
          maximum: 100
        attempts:
          type: integer
          minimum: 0
        maxAttempts:
          type: integer
          minimum: 1
        cancelRequested:
          type: boolean
        errorCode:
          type: [string, 'null']
          maxLength: 64
        createdAt:
          type: integer
        startedAt:
          type: [integer, 'null']
        finishedAt:
          type: [integer, 'null']
        result:
          type: object
          additionalProperties: false
          required: [transcriptId, generationId]
          properties:
            transcriptId:
