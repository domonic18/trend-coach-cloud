        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/events:
    post:
      summary: 接收白名单指标事件
      description: 需要用户同意；按 eventId 幂等。不接收 query 原文、回答内容或播放地址。
      security:
        - bearerAuth: []
