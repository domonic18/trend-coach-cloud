        indexed:
          type: boolean
        embedded:
          type: integer
          minimum: 0
        counts:
          type: object
          additionalProperties: false
          required: [chapters, knowledgePoints, chapterArticles, figures, segments]
          properties:
            chapters:
              type: integer
              minimum: 0
            knowledgePoints:
              type: integer
              minimum: 0
            chapterArticles:
              type: integer
              minimum: 0
            figures:
              type: integer
              minimum: 0
            segments:
              type: integer
              minimum: 0

    FigureStatus:
      type: string
      enum: [planned, rendering, ready, failed, published]

    FigureCandidateStatus:
      type: string
      enum: [rendering, ready, failed]

    FigureCandidate:
      type: object
      additionalProperties: false
      required:
        [candidateId, status, width, height, bytes, sourceSec, errorCode, previewUrl]
      properties:
        candidateId:
          type: string
          pattern: '^cand_[0-9a-f]{8,32}$'
        status:
          $ref: '#/components/schemas/FigureCandidateStatus'
        width:
          type: [integer, 'null']
          minimum: 800
        height:
          type: [integer, 'null']
          minimum: 800
        bytes:
          type: [integer, 'null']
          minimum: 1
        sourceSec:
          type: [number, 'null']
          minimum: 0
        errorCode:
          type: [string, 'null']
          maxLength: 64
        previewUrl:
          type: [string, 'null']
