    GenerationFigurePreview:
      type: object
      additionalProperties: false
      required: [key, chapterKey, kind, caption, candidateCount, needsReview]
      properties:
        key:
          type: string
        chapterKey:
          type: string
        kind:
          type: string
        caption:
          type: string
        candidateCount:
          type: integer
          minimum: 0
        needsReview:
          type: boolean

    GenerationSegmentPreview:
      type: object
      additionalProperties: false
      required: [key, pointKey, title, startMs, endMs]
      properties:
        key:
          type: string
        pointKey:
          type: string
        title:
          type: string
        startMs:
          type: integer
          minimum: 0
        endMs:
          type: integer
          minimum: 1

    GenerationPreview:
      type: object
      additionalProperties: false
      required: [generation, chapters, knowledgePoints, figures, segments]
      properties:
        generation:
          $ref: '#/components/schemas/GenerationSummary'
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/GenerationChapterPreview'
        knowledgePoints:
          type: array
          items:
            $ref: '#/components/schemas/GenerationKnowledgePointPreview'
        figures:
          type: array
          items:
            $ref: '#/components/schemas/GenerationFigurePreview'
        segments:
          type: array
          items:
            $ref: '#/components/schemas/GenerationSegmentPreview'

    AppliedContent:
      type: object
      additionalProperties: false
      required: [chapters, knowledgePoints, figures, segments]
      properties:
        chapters:
          type: object
          additionalProperties:
            type: string
        knowledgePoints:
          type: object
          additionalProperties:
            type: string
        figures:
          type: object
          additionalProperties:
            type: string
        segments:
          type: object
          additionalProperties:
            type: string

    GenerationApplyResult:
      type: object
      additionalProperties: false
      required:
        [generationId, alreadyApplied, courseId, chapters, knowledgePoints, figures,
         segments, chapterArticles, figuresApplied]
