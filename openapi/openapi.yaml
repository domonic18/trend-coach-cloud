    Figure:
      type: object
      additionalProperties: false
      required:
        [figureId, chapterId, kind, caption, status, selectedCandidateId, prompt, model,
         seed, reviewReasons, candidates]
      properties:
        figureId:
          type: string
          pattern: '^fig_[0-9a-f]{8}_[A-Za-z0-9._-]+$'
        chapterId:
          type: string
        kind:
          type: string
          enum: [keyframe, generated]
        caption:
          type: string
          minLength: 1
          maxLength: 200
        status:
          $ref: '#/components/schemas/FigureStatus'
        selectedCandidateId:
          type: [string, 'null']
        prompt:
          type: [string, 'null']
        model:
          type: [string, 'null']
        seed:
          type: [integer, 'null']
        reviewReasons:
          type: array
          items:
            type: string
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/FigureCandidate'

    FigureList:
      type: object
      additionalProperties: false
      required: [figures, total, offset, limit]
      properties:
        figures:
          type: array
          items:
            $ref: '#/components/schemas/Figure'
        total:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1

    IllustrateRequest:
      type: object
      additionalProperties: false
      properties:
        chapterIds:
          type: array
          maxItems: 50
          items:
            type: string
          description: 缺省时处理该课程全部有教材的章节。

    SelectFigureRequest:
      type: object
      additionalProperties: false
      required: [candidateId]
      properties:
        candidateId:
          type: string
          pattern: '^cand_[0-9a-f]{8,32}$'

    LlmPurpose:
      type: string
      enum: [content, embedding, image]

    AiTaskKey:
      type: string
      enum:
        [content.outline, content.points, content.article, content.chapter_article,
         content.figure_plan, image.figure, embedding.query, embedding.segment,
         asr.longform]

    LlmProtocol:
      type: string
      enum: [openai, anthropic]

    AsrProtocol:
      type: string
      enum: [minimax, openai]

    ModelTestResult:
      type: object
      additionalProperties: false
      required: [status, detail, testedAt]
      properties:
        status:
          type: string
          enum: [success, failed]
        detail:
          type: string
        testedAt:
          type: integer

    LlmConfig:
      type: object
      additionalProperties: false
      required:
        [configId, name, provider, protocol, baseUrl, model, purpose, apiKeyConfigured,
         apiKeyMasked, isDefault, isActive, inputPriceMicrosPer1k, outputPriceMicrosPer1k,
         imagePriceMicros, lastTestedAt, lastTestStatus, lastTestError, createdAt, updatedAt]
      properties:
        configId:
          type: string
          pattern: '^llmc_[0-9a-f]{16}$'
        name:
          type: string
        provider:
          type: string
        protocol:
          $ref: '#/components/schemas/LlmProtocol'
        baseUrl:
          type: string
        model:
          type: string
        purpose:
          $ref: '#/components/schemas/LlmPurpose'
        apiKeyConfigured:
          type: boolean
        apiKeyMasked:
          type: [string, 'null']
        isDefault:
          type: boolean
        isActive:
          type: boolean
        inputPriceMicrosPer1k:
          type: [integer, 'null']
          minimum: 0
          description: 微美元/千输入 token；null 表示未配置，成本不估算。
        outputPriceMicrosPer1k:
          type: [integer, 'null']
          minimum: 0
        imagePriceMicros:
          type: integer
          minimum: 0
          description: 单张图片成本（微美元），默认 120000（¥0.12）。
        lastTestedAt:
          type: [integer, 'null']
        lastTestStatus:
          type: [string, 'null']
          enum: [success, failed, null]
        lastTestError:
          type: [string, 'null']
        createdAt:
          type: integer
        updatedAt:
          type: integer

    CreateLlmConfigRequest:
      type: object
      additionalProperties: false
      required: [name, provider, baseUrl, model, purpose]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        provider:
          type: string
          maxLength: 32
        protocol:
          $ref: '#/components/schemas/LlmProtocol'
        baseUrl:
          type: string
          maxLength: 500
        model:
          type: string
          maxLength: 200
        purpose:
          $ref: '#/components/schemas/LlmPurpose'
        apiKey:
          type: string
          maxLength: 500
          description: 明文只在写入时出现；留空表示不配置密钥。
        isDefault:
          type: boolean
        isActive:
          type: boolean
        inputPriceMicrosPer1k:
          type: [integer, 'null']
          minimum: 0
        outputPriceMicrosPer1k:
          type: [integer, 'null']
          minimum: 0
        imagePriceMicros:
          type: integer
          minimum: 0

    UpdateLlmConfigRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
        provider:
          type: string
          maxLength: 32
        protocol:
          $ref: '#/components/schemas/LlmProtocol'
        baseUrl:
          type: string
          maxLength: 500
        model:
          type: string
          maxLength: 200
        purpose:
          $ref: '#/components/schemas/LlmPurpose'
        apiKey:
          type: string
          maxLength: 500
          description: 留空字符串表示保留原密钥。
        isDefault:
          type: boolean
        isActive:
          type: boolean
        inputPriceMicrosPer1k:
          type: [integer, 'null']
          minimum: 0
        outputPriceMicrosPer1k:
          type: [integer, 'null']
          minimum: 0
        imagePriceMicros:
          type: integer
          minimum: 0

    AsrConfig:
      type: object
      additionalProperties: false
      required:
        [provider, protocol, baseUrl, model, apiKeyConfigured, apiKeyMasked, enabled,
         lastTestedAt, lastTestStatus, lastTestError, updatedAt]
      properties:
        provider:
          type: string
        protocol:
          $ref: '#/components/schemas/AsrProtocol'
        baseUrl:
          type: string
        model:
          type: string
        apiKeyConfigured:
          type: boolean
        apiKeyMasked:
          type: [string, 'null']
        enabled:
          type: boolean
        lastTestedAt:
          type: [integer, 'null']
        lastTestStatus:
          type: [string, 'null']
          enum: [success, failed, null]
        lastTestError:
          type: [string, 'null']
        updatedAt:
          type: integer

    UpdateAsrConfigRequest:
      type: object
      additionalProperties: false
      properties:
        provider:
          type: string
          maxLength: 32
        protocol:
          $ref: '#/components/schemas/AsrProtocol'
        baseUrl:
          type: string
          maxLength: 500
        model:
          type: string
          maxLength: 200
        apiKey:
          type: string
          maxLength: 500
        enabled:
          type: boolean

  responses:
    BadRequest:
      description: 入参或结构不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 未授权或令牌过期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 设备不匹配或越权
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 资源不存在或已下架
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: 超出配额
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 资源已存在或当前状态不允许该操作
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: 请求体或音频超过上限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: 不支持的请求内容类型
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: 未识别到语音
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGateway:
      description: 上游协议异常
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: 上游不可用或未配置
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

paths:
  /health:
    get:
      summary: 健康检查（含数据库连通性）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean

  /v1/auth/device/code:
    post:
      summary: 发起设备码授权
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [clientId, deviceId]
              properties:
                clientId:
                  const: dsh-plugin-trend-coach
                deviceId:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        '200':
          description: 设备码已签发
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCodeStart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/auth/device/token:
    post:
      summary: 轮询设备码状态
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [deviceCode]
              properties:
                deviceCode:
                  type: string
      responses:
        '200':
          description: 待批准 / 已过期 / 已授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/auth/refresh:
    post:
      summary: 轮换 access/refresh 令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken, deviceId]
              properties:
                refreshToken:
                  type: string
                deviceId:
                  type: string
      responses:
        '200':
          description: 新 grant；旧 refresh 立即失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/auth/revoke:
    post:
      summary: 注销当前设备并吊销其令牌
      description: 吊销该设备全部 access/refresh 并置为 revoked；重新设备授权可恢复，不影响同账号其它设备。
      security:
        - bearerAuth: []
          deviceId: []
      responses:
        '200':
          description: 已注销
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/auth/device/approve:
    post:
      summary: 批准设备码并绑定账号
      description: |
        学员：提交 `userCode` + `username`/`password`，或 `userCode` + `inviteCode` + 新 `password`。
        运营/管理员：带后台会话 Bearer，提交 `userCode` 与可选 `userId` 代批。
        不再接受共享控制台令牌；设备批准后绑定固定账号。
      security:
        - sessionAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userCode]
              properties:
                userCode:
                  type: string
                  pattern: '^[A-Z0-9]{4}-[A-Z0-9]{4}$'
                username:
                  type: string
                  pattern: '^[a-z][a-z0-9._-]{2,31}$'
                password:
                  type: string
                  minLength: 10
                  maxLength: 128
                inviteCode:
                  type: string
                  maxLength: 32
                userId:
                  type: string
                  maxLength: 64
                  description: 仅后台会话代批时可用。
      responses:
        '200':
          description: 已批准
          content:
            application/json:
              schema:
                type: object
                required: [approved]
                properties:
                  approved:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/kb/search:
    post:
      summary: Top-K 片段检索
      security:
        - bearerAuth: []
          deviceId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query:
                  type: string
                  description: 去首尾空白后 1–500 字符
                topK:
                  type: integer
                  minimum: 1
                  maximum: 20
                  default: 5
                courseId:
                  type: string
                  pattern: '^[A-Za-z0-9._-]{1,64}$'
      responses:
        '200':
          description: 检索结果；空召回时给 relatedKnowledgePoints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

