              chapterId:
                type: string
              key:
                type: string
        knowledgePoints:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [knowledgePointId, key]
            properties:
              knowledgePointId:
                type: string
              key:
                type: string
        figures:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [figureId, key]
            properties:
              figureId:
                type: string
              key:
                type: string
        segments:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [segmentId, key]
            properties:
              segmentId:
                type: string
              key:
                type: string
