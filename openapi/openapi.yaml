  /v1/admin/content/segments:
    get:
      summary: 片段列表（operator/admin）
      description: 支持按课程、知识点、状态与标题/文本关键字过滤。
      security:
        - sessionAuth: []
      parameters:
        - name: courseId
          in: query
          schema:
            type: string
            pattern: '^[A-Za-z0-9._-]{1,64}$'
        - name: knowledgePointId
          in: query
          schema:
            type: string
            pattern: '^[A-Za-z0-9._-]{1,64}$'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ContentStatus'
        - name: query
          in: query
          schema:
            type: string
            maxLength: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100000
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: 片段列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSegmentList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: 创建片段（operator/admin）
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSegmentRequest'
      responses:
