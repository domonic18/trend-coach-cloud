      properties:
        key:
          type: string
        chapterKey:
          type: string
        title:
          type: string
        position:
          type: integer
          minimum: 0
        confidence:
          type: number
          minimum: 0
          maximum: 1
        needsReview:
          type: boolean
        reviewReasons:
          type: array
