      security:
        - bearerAuth: []
          deviceId: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9._-]{1,64}$'
      responses:
        '200':
          description: 课程树，知识点内联当前用户进度
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogCourse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/catalog/knowledge-points/{knowledgePointId}:
    get:
      summary: 知识点详情与已发布文章
      security:
        - bearerAuth: []
          deviceId: []
      parameters:
        - name: knowledgePointId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9._-]{1,64}$'
      responses:
        '200':
          description: 知识点详情；无已发布文章时 article 为 null
          content:
            application/json:
