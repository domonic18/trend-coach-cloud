  /v1/events/consent:
    get:
      summary: 读取指标上报同意状态
      description: 默认未同意；插件只在该用户明确同意后上报白名单事件。
      security:
        - bearerAuth: []
          deviceId: []
      responses:
        '200':
          description: 当前同意状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsConsent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      summary: 修改指标上报同意状态
