name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: trend_coach
          POSTGRES_PASSWORD: trend_coach
          POSTGRES_DB: trend_coach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trend_coach -d trend_coach_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://trend_coach:trend_coach@127.0.0.1:5432/trend_coach_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
